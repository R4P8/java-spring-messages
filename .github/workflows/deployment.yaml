name: Deploy Spring Boot

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Setup WireGuard
        run: |
          sudo apt-get update
          sudo apt-get install -y wireguard

          sudo mkdir -p /etc/wireguard
          cat <<EOF | sudo tee /etc/wireguard/wg0.conf
          [Interface]
          PrivateKey = ${{ secrets.WIREGUARD_PRIVATE_KEY }}
          Address = 10.0.0.2/24

          [Peer]
          PublicKey = ${{ secrets.WIREGUARD_SERVER_PUBLIC_KEY }}
          Endpoint = ${{ secrets.WIREGUARD_ENDPOINT }}
          AllowedIPs = 10.0.0.0/24
          PersistentKeepalive = 25
          EOF

          sudo chmod 600 /etc/wireguard/wg0.conf
          sudo wg-quick up wg0

      - name: Deploy to sandbox-datadog
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e
            cd /home/user/rafa/myapp
            echo "==> Pull latest code"
            git fetch origin main
            git reset --hard origin/main
            echo "==> Build application"
            ./mvnw package -DskipTests
            echo "==> Update DD_VERSION"
            GIT_SHA=$(git rev-parse --short HEAD)
            sudo sed -i "s/^DD_VERSION=.*/DD_VERSION=${GIT_SHA}/" /etc/default/myapp
            echo "==> Restart Spring Boot"
            sudo systemctl restart myapp
            echo "==> Check service"
            sudo systemctl is-active --quiet myapp
            echo "Deployment successful"

      - name: Teardown WireGuard
        if: always()
        run: sudo wg-quick down wg0 || true
